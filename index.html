<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Cooking Sim</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1714; }
      #app { position: fixed; inset: 0; touch-action: none; }
      #app canvas { display: block; width: 100%; height: 100%; }
      #debug {
        position: fixed; top: 8px; left: 8px; padding: 6px 8px; border-radius: 6px;
        font: 12px/1.4 ui-monospace, Menlo, monospace; color: #f3e9dc;
        background: rgba(0, 0, 0, 0.55); pointer-events: none; white-space: pre;
      }
      #debug.hidden { display: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="debug"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
